<div class="book-arrival" id="book-arrival" aria-hidden="true" hidden>
  <div class="book-arrival__sheet">
    <span class="book-arrival__title"></span>
    <span class="book-arrival__author"></span>
  </div>
</div>
<script>
  try {
    const arrival = JSON.parse(sessionStorage.getItem("wk_book_arrival") || "null");
    const requestedId = new URLSearchParams(location.search).get("id");
    const layer = document.getElementById("book-arrival");
    if (arrival && arrival.id === requestedId && layer) {
      layer.querySelector(".book-arrival__title").textContent = arrival.title || "";
      layer.querySelector(".book-arrival__author").textContent = arrival.author || "";
      const scale = Math.min(5, Math.max(1, Number(arrival.scale) || 1));
      layer.style.setProperty("--arrival-scale", scale);
      layer.style.setProperty("--arrival-line", `${26 * scale}px`);
      layer.hidden = false;
      layer.addEventListener("animationend", () => layer.remove(), { once: true });
      sessionStorage.removeItem("wk_book_arrival");
    }
  } catch {
    /* 浏览器禁用会话存储时直接显示作品详情。 */
  }
</script>
