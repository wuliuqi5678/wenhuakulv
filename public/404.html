<script>
  /* 本地服务在任意深度返回 404.html 时，把相对资源拉回站点根目录。
     GitHub Pages 的项目站点多一层 /仓库名/，同样要把 base 指到仓库根，
     否则 /仓库名/a/b 的 404 会去请求 /仓库名/a/css/site.css。 */
  (function () {
    try {
      var host = location.hostname;
      var isLocal = host === "127.0.0.1" || host === "localhost" || host === "::1" || host === "[::1]";
      if (isLocal) {
        var localBase = document.createElement("base");
        localBase.href = "/";
        document.head.prepend(localBase);
        return;
      }
      if (/(?:^|\.)github\.io$/i.test(host)) {
        var segment = location.pathname.split("/").filter(Boolean)[0];
        var base = document.createElement("base");
        base.href = segment ? "/" + segment + "/" : "/";
        document.head.prepend(base);
      }
    } catch (e) {}
  })();
</script>
